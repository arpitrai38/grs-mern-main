services:
  # Backend API Web Service
  - type: web
    name: grs-mern-server
    env: node
    plan: free
    rootDir: grs-mern-main/server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false

  # Frontend React Static Site
  - type: web
    name: grs-mern-client
    env: static
    plan: free
    rootDir: grs-mern-main/client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
